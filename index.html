<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>CSM PPT Dashboard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3f8;
  color: #172033;
}

.container {
  width: min(1100px, 94%);
  margin: 40px auto;
}

.header {
  background: #172554;
  color: white;
  padding: 30px;
  border-radius: 18px;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0 0 8px;
}

.header p {
  margin: 0;
  opacity: .85;
}

.controls {
  background: white;
  padding: 25px;
  border-radius: 18px;
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

label {
  font-weight: bold;
  margin-bottom: 7px;
  display: block;
}

select,
button {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #ccd5e0;
  font-size: 15px;
}

button {
  background: #172554;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: .9;
}

.results {
  margin-top: 25px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  box-shadow: 0 5px 18px rgba(0,0,0,.07);
}

.info h3 {
  margin: 0 0 7px;
}

.info p {
  margin: 4px 0;
  color: #596579;
}

.present {
  width: auto;
  min-width: 130px;
}

.status {
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  margin-top: 20px;
}

@media(max-width:700px) {

  .controls {
    grid-template-columns: 1fr;
  }

  .card {
    flex-direction: column;
    align-items: stretch;
  }

  .present {
    width: 100%;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>CSM PPT Dashboard</h1>

    <p>
      Select a subject and presentation type
      to view all submitted PPTs.
    </p>

  </div>


  <div class="controls">

    <div>

      <label>
        Select Subject
      </label>

      <select id="subject">

        <option value="">
          Select Subject
        </option>

        <option value="Node-JS">
          Node-JS
        </option>

        <option value="CM">
          CM
        </option>

        <option value="JAVA">
          JAVA
        </option>

        <option value="DBMS">
          DBMS
        </option>

        <option value="SE">
          SE
        </option>

        <option value="COA">
          COA
        </option>

      </select>

    </div>


    <div>

      <label>
        Select Type
      </label>

      <select id="category">

        <option value="">
          Select Type
        </option>

        <option value="lab">
          Lab
        </option>

        <option value="theory">
          Theory
        </option>

        <option value="project">
          Project
        </option>

      </select>

    </div>


    <div style="display:flex;align-items:end;">

      <button
        id="searchButton"
        onclick="searchPPTs()"
      >
        SEARCH PPTs
      </button>

    </div>

  </div>


  <div
    id="status"
    class="status"
  >
    Select subject and type, then click SEARCH PPTs.
  </div>


  <div
    id="results"
    class="results"
  ></div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxHJcKMqv9YIyoNaOZyZOTsmWlQmzqJNNA6pZ8vQPZQReTEXtFF1nubHOIcC94iI_KE/exec";


async function searchPPTs() {

  const subject =
    document
      .getElementById("subject")
      .value;

  const category =
    document
      .getElementById("category")
      .value;

  const status =
    document
      .getElementById("status");

  const results =
    document
      .getElementById("results");


  results.innerHTML = "";


  if (!subject || !category) {

    status.textContent =
      "Please select both subject and type.";

    return;

  }


  status.textContent =
    "Searching PPTs...";


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            action: "getPPTs",

            subject: subject,

            category: category

          })

        }
      );


    const text =
      await response.text();


    const data =
      JSON.parse(text);


    if (!data.ok) {

      throw new Error(
        data.error ||
        "Unable to retrieve PPTs."
      );

    }


    if (
      !data.submissions ||
      data.submissions.length === 0
    ) {

      status.textContent =
        "No PPTs have been submitted yet.";

      return;

    }


    status.textContent =
      data.count +
      " PPT(s) found.";


    for (
      let i = 0;
      i < data.submissions.length;
      i++
    ) {

      const item =
        data.submissions[i];


      const card =
        document.createElement("div");

      card.className =
        "card";


      const info =
        document.createElement("div");

      info.className =
        "info";


      const title =
        document.createElement("h3");

      title.textContent =
        item.roll;


      const file =
        document.createElement("p");

      file.textContent =
        item.fileName;


      const subjectText =
        document.createElement("p");

      subjectText.textContent =
        item.subject +
        " • " +
        capitalize(item.category);


      info.appendChild(title);

      info.appendChild(file);

      info.appendChild(subjectText);


      const button =
        document.createElement("button");

      button.className =
        "present";

      button.textContent =
        "OPEN / PRESENT";


      button.onclick =
        function() {

          window.open(
            item.presentationUrl ||
            item.fileUrl,
            "_blank"
          );

        };


      card.appendChild(info);

      card.appendChild(button);

      results.appendChild(card);

    }

  }
  catch(error) {

    console.error(error);

    status.textContent =
      error.message ||
      "Unable to connect to the server.";

  }

}


function capitalize(value) {

  return value.charAt(0).toUpperCase() +
    value.substring(1);

}

</script>

</body>
</html>
